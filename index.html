<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Calculator</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage-compat.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* ===== الثيمات ===== */
        :root {
            --bg: #0b141a;
            --chat-bg: #1a2c38;
            --msg-other: #202c33;
            --msg-me: #005c4b;
            --text: #e9edef;
            --input-bg: #2a3942;
            --border: #2a3942;
            --shadow: rgba(0,0,0,0.5);
            --hover: #2a3942;
            --time-color: #aebac1;
            --header-bg: #1f2c33;
            --tick-color: #8696a0;
            --tick-blue: #53bdeb;
            --record-color: #e74c3c;
            --accent: #25d366;
            --accent-hover: #1da851;
            --radius: 28px;
            --transition: 0.3s;
            --call-bg: rgba(0,0,0,0.85);
            --call-text: #fff;
        }

        [data-theme="light"] {
            --bg: #e8edf0;
            --chat-bg: #ffffff;
            --msg-other: #ffffff;
            --msg-me: #d9fdd3;
            --text: #111b21;
            --input-bg: #f0f2f5;
            --border: #e9edef;
            --shadow: rgba(0,0,0,0.1);
            --hover: #f0f2f5;
            --time-color: #667781;
            --header-bg: #f0f2f5;
            --tick-color: #667781;
            --tick-blue: #53bdeb;
            --call-bg: rgba(0,0,0,0.85);
            --call-text: #fff;
        }

        [data-theme="blue"] {
            --bg: #0a1628;
            --chat-bg: #1a2a4a;
            --msg-other: #1e3a5f;
            --msg-me: #005c8a;
            --text: #e9edef;
            --input-bg: #1a3a5a;
            --border: #1a3a5a;
            --shadow: rgba(0,0,0,0.5);
            --hover: #1a3a5a;
            --time-color: #aebac1;
            --header-bg: #0d2137;
            --tick-color: #8696a0;
            --tick-blue: #4fc3f7;
            --accent: #2196f3;
            --accent-hover: #1976d2;
        }

        [data-theme="green"] {
            --bg: #0a1a0a;
            --chat-bg: #1a2a1a;
            --msg-other: #1e3a1e;
            --msg-me: #004d26;
            --text: #e9edef;
            --input-bg: #1a3a1a;
            --border: #1a3a1a;
            --shadow: rgba(0,0,0,0.5);
            --hover: #1a3a1a;
            --time-color: #aebac1;
            --header-bg: #0d1f0d;
            --tick-color: #8696a0;
            --tick-blue: #66bb6a;
            --accent: #4caf50;
            --accent-hover: #388e3c;
        }

        [data-theme="pink"] {
            --bg: #1a0a14;
            --chat-bg: #2a1a24;
            --msg-other: #3a1e32;
            --msg-me: #5c0040;
            --text: #e9edef;
            --input-bg: #3a1a2e;
            --border: #3a1a2e;
            --shadow: rgba(0,0,0,0.5);
            --hover: #3a1a2e;
            --time-color: #aebac1;
            --header-bg: #1f0d18;
            --tick-color: #8696a0;
            --tick-blue: #f06292;
            --accent: #e91e63;
            --accent-hover: #c2185b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: var(--transition);
            margin: 0;
            padding: 10px;
        }

        /* ===== حاوية الآلة الحاسبة ===== */
        #calculator {
            background: var(--chat-bg);
            padding: 30px 25px;
            border-radius: var(--radius);
            box-shadow: 0 20px 60px var(--shadow);
            width: 340px;
            text-align: center;
            transition: var(--transition);
            position: relative;
        }

        #calc-display {
            width: 100%;
            height: 80px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 2.8rem;
            text-align: right;
            padding: 15px 20px;
            border: none;
            border-radius: 20px;
            outline: none;
            margin-bottom: 20px;
            font-weight: bold;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .calc-buttons button {
            padding: 20px;
            font-size: 1.6rem;
            font-weight: bold;
            border: none;
            border-radius: 18px;
            background: var(--msg-other);
            color: var(--text);
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .calc-buttons button:hover {
            background: var(--hover);
            transform: scale(0.96);
        }

        .calc-buttons .op {
            background: #f39c12;
            color: #1e1e2f;
        }

        .calc-buttons .op:hover {
            background: #e67e22;
        }

        .calc-buttons .eq {
            background: var(--accent);
            color: #fff;
            grid-column: span 2;
        }

        .calc-buttons .eq:hover {
            background: var(--accent-hover);
        }

        .calc-buttons .clear {
            background: #e74c3c;
            color: #fff;
        }

        .calc-buttons .clear:hover {
            background: #c0392b;
        }

        #error-msg {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 10px;
            height: 20px;
        }

        /* ===== رسالة الترحيب ===== */
        #welcome-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeIn 0.5s ease;
        }

        #welcome-overlay.show {
            display: flex;
        }

        #welcome-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 40px 50px;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #welcome-box h1 {
            color: #fff;
            font-size: 2.2rem;
            font-weight: 700;
            text-shadow: 0 0 30px rgba(37, 211, 102, 0.3);
            margin: 0;
        }

        #welcome-box .emoji {
            font-size: 3rem;
            display: block;
            margin-bottom: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes popIn {
            0% { transform: scale(0.5) rotate(-5deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* ===== الشات الرئيسي ===== */
        #app {
            display: none;
            width: 100%;
            max-width: 500px;
            height: 95vh;
            max-height: 800px;
            background: var(--chat-bg);
            border-radius: var(--radius);
            box-shadow: 0 20px 60px var(--shadow);
            flex-direction: column;
            overflow: hidden;
            transition: var(--transition);
            position: relative;
        }

        .header {
            background: var(--header-bg);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left h2 {
            color: var(--text);
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-left h2 i {
            color: var(--accent);
            font-size: 1.3rem;
        }

        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .header-actions button {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 1rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: 0.2s;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .header-actions button:hover {
            background: var(--hover);
        }

        .header-actions button .badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #e74c3c;
            color: #fff;
            font-size: 0.5rem;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== شاشة تسجيل الدخول ===== */
        #login-area {
            padding: 12px 16px;
            background: var(--chat-bg);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #login-area .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #login-area .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
            cursor: pointer;
            transition: 0.2s;
            background: var(--input-bg);
        }

        #login-area .user-avatar:hover {
            opacity: 0.8;
        }

        #login-area .user-avatar-placeholder {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--input-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--time-color);
            font-size: 1.2rem;
            border: 2px dashed var(--border);
            cursor: pointer;
            transition: 0.2s;
        }

        #login-area .user-avatar-placeholder:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        #login-area .username-display {
            color: var(--text);
            font-weight: 600;
            font-size: 0.85rem;
        }

        #login-area .login-inputs {
            display: flex;
            gap: 6px;
            flex: 1;
            flex-wrap: wrap;
        }

        #login-area .login-inputs input {
            flex: 1;
            padding: 6px 12px;
            border: none;
            border-radius: 20px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 0.8rem;
            outline: 2px solid transparent;
            transition: 0.2s;
            min-width: 80px;
        }

        #login-area .login-inputs input:focus {
            outline-color: var(--accent);
        }

        #login-area .login-inputs button {
            padding: 6px 14px;
            border: none;
            border-radius: 20px;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        #login-area .login-inputs button:hover {
            background: var(--accent-hover);
            transform: scale(0.97);
        }

        /* ===== منطقة الرسائل ===== */
        #messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            background: var(--chat-bg);
            scroll-behavior: smooth;
        }

        #messages-container::-webkit-scrollbar {
            width: 5px;
        }
        #messages-container::-webkit-scrollbar-track {
            background: transparent;
        }
        #messages-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        /* ===== الرسالة ===== */
        .message {
            max-width: 88%;
            padding: 5px 10px 6px 10px;
            border-radius: 10px;
            font-size: 0.88rem;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
            animation: slideUp 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
            transition: 0.2s;
        }

        .message.other {
            background: var(--msg-other);
            color: var(--text);
            align-self: flex-start;
            border-bottom-left-radius: 3px;
        }

        .message.me {
            background: var(--msg-me);
            color: var(--text);
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }

        .message .msg-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 1px;
        }

        .message .msg-avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .message .msg-username {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--accent);
        }

        .message .msg-text {
            display: block;
            margin-left: 26px;
        }

        /* ===== رسالة صوتية ===== */
        .message .voice-message {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 26px;
            padding: 4px 10px;
            background: rgba(37, 211, 102, 0.08);
            border-radius: 16px;
            min-width: 120px;
        }

        .message .voice-message audio {
            flex: 1;
            height: 30px;
            border-radius: 16px;
            outline: none;
        }

        .message .voice-message audio::-webkit-media-controls-panel {
            background: transparent;
        }

        .message .voice-message .voice-icon {
            color: var(--accent);
            font-size: 0.9rem;
        }

        /* ===== رسالة صورة ===== */
        .message .image-message {
            margin-left: 26px;
            max-width: 200px;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
        }

        .message .image-message:hover {
            transform: scale(1.02);
        }

        .message .image-message img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
        }

        .message .msg-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 3px;
            margin-top: 2px;
            margin-left: 26px;
        }

        .message .msg-time {
            font-size: 0.55rem;
            color: var(--time-color);
        }

        .tick {
            font-size: 0.65rem;
            color: var(--tick-color);
            letter-spacing: -1px;
        }

        .tick.read {
            color: var(--tick-blue);
        }

        .message .delete-btn {
            background: transparent;
            border: none;
            color: var(--time-color);
            cursor: pointer;
            font-size: 0.6rem;
            padding: 1px 4px;
            border-radius: 8px;
            transition: 0.2s;
            opacity: 0;
        }

        .message:hover .delete-btn {
            opacity: 1;
        }

        .message .delete-btn:hover {
            background: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
        }

        .empty-state {
            color: var(--time-color);
            text-align: center;
            font-size: 0.85rem;
            margin-top: 40px;
            opacity: 0.4;
        }

        /* ===== منطقة الإدخال ===== */
        #input-area {
            padding: 8px 12px;
            background: var(--header-bg);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        #input-area input {
            flex: 1;
            padding: 8px 14px;
            border: none;
            border-radius: 20px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 0.88rem;
            outline: 2px solid transparent;
            transition: 0.2s;
            min-width: 60px;
        }

        #input-area input:focus {
            outline-color: var(--accent);
        }

        #input-area input::placeholder {
            color: var(--time-color);
        }

        #input-area .action-btn {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.95rem;
            background: var(--input-bg);
            color: var(--text);
        }

        #input-area .action-btn:hover {
            background: var(--hover);
            transform: scale(0.95);
        }

        #input-area .send-btn {
            background: var(--accent);
            color: #fff;
        }

        #input-area .send-btn:hover {
            background: var(--accent-hover);
        }

        #input-area .record-btn.recording {
            background: var(--record-color);
            color: #fff;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        #input-area .record-btn .recording-dot {
            display: none;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            animation: blink 0.5s infinite;
        }

        #input-area .record-btn.recording .recording-dot {
            display: block;
        }

        #input-area .record-btn.recording i {
            display: none;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        #record-timer {
            color: var(--record-color);
            font-size: 0.75rem;
            font-weight: 600;
            min-width: 35px;
            text-align: center;
        }

        /* ===== شاشة المكالمة ===== */
        #call-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--call-bg);
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--call-text);
            animation: fadeIn 0.4s ease;
        }

        #call-overlay.show {
            display: flex;
        }

        #call-overlay .call-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            margin-bottom: 20px;
        }

        #call-overlay .call-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        #call-overlay .call-status {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 30px;
        }

        #call-overlay .call-timer {
            font-size: 1.2rem;
            font-weight: 300;
            margin-bottom: 30px;
            font-variant-numeric: tabular-nums;
        }

        #call-overlay .call-actions {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #call-overlay .call-actions button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        #call-overlay .call-actions button:hover {
            transform: scale(1.05);
        }

        #call-overlay .call-actions .call-end {
            background: #e74c3c;
        }

        #call-overlay .call-actions .call-end:hover {
            background: #c0392b;
        }

        #call-overlay .call-actions .call-mute {
            background: #2a3942;
        }

        #call-overlay .call-actions .call-mute:hover {
            background: #3a4a52;
        }

        #call-overlay .call-actions .call-mute.active {
            background: #e74c3c;
        }

        #call-overlay .call-actions .call-video-toggle {
            background: #2a3942;
        }

        #call-overlay .call-actions .call-video-toggle:hover {
            background: #3a4a52;
        }

        #call-overlay .call-actions .call-video-toggle.active {
            background: var(--accent);
        }

        #call-overlay .call-actions .call-switch {
            background: #2a3942;
        }

        #call-overlay .call-actions .call-switch:hover {
            background: #3a4a52;
        }

        #call-overlay .call-video {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 120px;
            height: 160px;
            border-radius: 16px;
            background: #1a1a2e;
            border: 2px solid var(--accent);
            object-fit: cover;
        }

        #call-overlay .call-remote-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* ===== تاريخ الرسائل ===== */
        #history-panel {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            max-height: 50vh;
            background: var(--chat-bg);
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -10px 40px var(--shadow);
            z-index: 9998;
            padding: 20px;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
            border-top: 2px solid var(--accent);
        }

        #history-panel.show {
            display: block;
        }

        #history-panel .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: var(--text);
        }

        #history-panel .history-header h3 {
            font-size: 1.1rem;
        }

        #history-panel .history-header button {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 1.2rem;
            cursor: pointer;
        }

        #history-panel .history-item {
            padding: 8px 12px;
            margin-bottom: 6px;
            border-radius: 10px;
            background: var(--msg-other);
            color: var(--text);

    <script>
        // ============================================================

        const firebaseConfig = {

            messagingSenderId: "987084105580",
            appId: "1:987084105580:web:9ff427f55e1afd1d32f549"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ============================================================
        // المتغيرات
        // ============================================================
        let myUsername = localStorage.getItem('chatUsername') || 'زائر';
        let myAvatar = localStorage.getItem('chatAvatar') || '';
        let isDark = localStorage.getItem('chatTheme') !== 'light';
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let recordTimer = null;
        let seconds = 0;
        let notificationsEnabled = localStorage.getItem('notifications') !== 'false';
        let isCallActive = false;
        let callTimer = null;
        let callSeconds = 0;
        let isMuted = false;
        let isVideoOn = true;
        let localStream = null;
        let remoteStream = null;
        let peerConnection = null;
        let callType = 'audio';

        // ============================================================
        // عناصر DOM
        // ============================================================
        const display = document.getElementById('calc-display');
        const errorMsg = document.getElementById('error-msg');
        const calculator = document.getElementById('calculator');
        const app = document.getElementById('app');
        const messagesContainer = document.getElementById('messages-container');
        const msgInput = document.getElementById('msgInput');
        const usernameInput = document.getElementById('usernameInput');
        const currentUserSpan = document.getElementById('currentUser');
        const emptyState = document.getElementById('emptyState');
        const welcomeOverlay = document.getElementById('welcome-overlay');
        const userAvatar = document.getElementById('userAvatar');
        const avatarPlaceholder = document.getElementById('avatarPlaceholder');
        const avatarInput = document.getElementById('avatarInput');
        const recordBtn = document.getElementById('recordBtn');
        const recordTimerSpan = document.getElementById('record-timer');
        const notifBtn = document.getElementById('notifBtn');
        const callOverlay = document.getElementById('call-overlay');
        const callAvatar = document.getElementById('callAvatar');
        const callName = document.getElementById('callName');
        const callStatus = document.getElementById('callStatus');
        const callTimerSpan = document.getElementById('callTimer');
        const callLocalVideo = document.getElementById('callLocalVideo');
        const callRemoteVideo = document.getElementById('callRemoteVideo');
        const historyPanel = document.getElementById('history-panel');
        const historyContent = document.getElementById('history-content');
        const themeMenu = document.getElementById('theme-menu');

        // ============================================================
        // تحميل بيانات المستخدم
        // ============================================================
        if (myAvatar) {
            userAvatar.src = myAvatar;
            userAvatar.style.display = 'block';
            avatarPlaceholder.style.display = 'none';
        }

        currentUserSpan.textContent = myUsername;
        updateNotifButton();

        // ============================================================
        // دوال الآلة الحاسبة
        // ============================================================
        function appendVal(val) {
            if (display.value === '0') display.value = '';
            display.value += val;
            errorMsg.textContent = '';
        }

        function clearDisplay() {
            display.value = '0';
            errorMsg.textContent = '';
        }

        // ============================================================
        // الكود السري
        // ============================================================
        function checkSecret() {
            if (display.value.trim() === '115500') {
                errorMsg.textContent = '✅ Access granted...';
                welcomeOverlay.classList.add('show');
                setTimeout(() => {
                    calculator.style.display = 'none';
                }, 300);
                setTimeout(() => {
                    welcomeOverlay.classList.remove('show');
                    app.style.display = 'flex';
                }, 3000);
                return;
            }
            try {
                const result = Function('"use strict"; return (' + display.value + ')')();
                display.value = result;
                errorMsg.textContent = '';
            } catch (e) {
                errorMsg.textContent = '⚠️ Error';
            }
        }

        // ============================================================
        // دوال المستخدم
        // ============================================================
        function setUsername() {
            const name = usernameInput.value.trim();
            if (name.length < 2) {
                alert('الاسم يجب أن يكون حرفين على الأقل');
                return;
            }
            myUsername = name;
            localStorage.setItem('chatUsername', myUsername);
            currentUserSpan.textContent = myUsername;
            usernameInput.value = '';
            usernameInput.placeholder = '👤 غير اسمك...';
        }

        function uploadAvatar(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageData = e.target.result;
                myAvatar = imageData;
                localStorage.setItem('chatAvatar', imageData);
                userAvatar.src = imageData;
                userAvatar.style.display = 'block';
                avatarPlaceholder.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        // ============================================================
        // الثيمات
        // ============================================================
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('chatTheme', theme);
            themeMenu.style.display = 'none';
        }

        function toggleThemeMenu() {
            themeMenu.style.display = themeMenu.style.display === 'none' ? 'block' : 'none';
        }

        // ============================================================
        // الإشعارات
        // ============================================================
        function toggleNotifications() {
            notificationsEnabled = !notificationsEnabled;
            localStorage.setItem('notifications', notificationsEnabled);
            updateNotifButton();
            if (notificationsEnabled) {
                playNotificationSound();
            }
        }

        function updateNotifButton() {
            notifBtn.innerHTML = notificationsEnabled ? 
                '<i class="fas fa-bell"></i>' : 
                '<i class="fas fa-bell-slash"></i>';
        }

        function playNotificationSound() {
            try {
                const audio = new Audio('data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoAAACBhYqNlJaWkZ2Xlp+WkZ6PkJmKiI6Vj4qMkY+KjI+Gi4mRhoWGhY+Jh4iQj4SLj5KGi4+RhY+IkYqChgAA');
                audio.play().catch(() => {});
            } catch(e) {}
        }

        // ============================================================
        // المكالمات (WebRTC)
        // ============================================================
        async function startCall(type) {
            callType = type;
            callOverlay.classList.add('show');
            callName.textContent = myUsername;
            callAvatar.src = myAvatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(myUsername) + '&background=25d366&color=fff';
            callStatus.textContent = 'جاري الاتصال...';
            callTimerSpan.textContent = '00:00';
            callSeconds = 0;
            isCallActive = true;

            try {
                const constraints = {
                    audio: true,
                    video: type === 'video'
                };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                
                if (type === 'video') {
                    callLocalVideo.style.display = 'block';
                    callLocalVideo.srcObject = localStream;
                    callRemoteVideo.style.display = 'block';
                }

                // محاكاة الاتصال (بدون سيرفر STUN حقيقي)
                setTimeout(() => {
                    callStatus.textContent = 'متصل';
                    callTimer = setInterval(() => {
                        callSeconds++;
                        const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
                        const secs = String(callSeconds % 60).padStart(2, '0');
                        callTimerSpan.textContent = `${mins}:${secs}`;
                    }, 1000);
                }, 1500);

            } catch (err) {
                alert('مطلوب إذن للوصول إلى الميكروفون والكاميرا');
                endCall();
            }
        }

        function toggleMute() {
            if (localStream) {
                isMuted = !isMuted;
                localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
                document.querySelector('.call-mute').classList.toggle('active');
                document.querySelector('.call-mute i').className = isMuted ? 'fas fa-microphone-slash' : 'fas fa-microphone';
            }
        }

        function toggleVideo() {
            if (localStream) {
                isVideoOn = !isVideoOn;
                localStream.getVideoTracks().forEach(track => track.enabled = isVideoOn);
                document.querySelector('.call-video-toggle').classList.toggle('active');
                document.querySelector('.call-video-toggle i').className = isVideoOn ? 'fas fa-video' : 'fas fa-video-slash';
                callLocalVideo.style.display = isVideoOn ? 'block' : 'none';
            }
        }

        function switchCamera() {
            // محاكاة تبديل الكاميرا (في الواقع تحتاج enumerateDevices)
            alert('🔁 تم تبديل الكاميرا (محاكاة)');
        }

        function endCall() {
            isCallActive = false;
            clearInterval(callTimer);
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            callOverlay.classList.remove('show');
            callLocalVideo.style.display = 'none';
            callRemoteVideo.style.display = 'none';
            callLocalVideo.srcObject = null;
            callRemoteVideo.srcObject = null;
        }

        // ============================================================
        // التسجيل الصوتي
        // ============================================================
        async function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                await startRecording();
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await sendVoiceMessage(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                recordBtn.classList.add('recording');
                seconds = 0;
                recordTimerSpan.textContent = '00:00';
                recordTimer = setInterval(() => {
                    seconds++;
                    const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
                    const secs = String(seconds % 60).padStart(2, '0');
                    recordTimerSpan.textContent = `${mins}:${secs}`;
                }, 1000);

            } catch (err) {
                alert('مطلوب إذن للوصول إلى الميكروفون');
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.classList.remove('recording');
                clearInterval(recordTimer);
                recordTimerSpan.textContent = '';
            }
        }

        // ============================================================
        // إرسال رسالة صوتية
        // ============================================================
        async function sendVoiceMessage(audioBlob) {
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onload = function() {
                const audioData = reader.result;
                const newMsgRef = db.ref('messages').push();
                newMsgRef.set({
                    id: newMsgRef.key,
                    type: 'voice',
                    audio: audioData,
                    username: myUsername,
                    avatar: myAvatar || '',
                    time: Date.now(),
                    read: false,
                    sender: myUsername
                });
            };
        }

        // ============================================================
        // إرسال صورة
        // ============================================================
        function sendImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageData = e.target.result;
                const newMsgRef = db.ref('messages').push();
                newMsgRef.set({
                    id: newMsgRef.key,
                    type: 'image',
                    image: imageData,
                    username: myUsername,
                    avatar: myAvatar || '',
                    time: Date.now(),
                    read: false,
                    sender: myUsername
                });
                event.target.value = '';
            };
            reader.readAsDataURL(file);
        }

        // ============================================================
        // إرسال رسالة نصية
        // ============================================================
        function sendMessage() {
            const text = msgInput.value.trim();
            if (text === '') return;

            const newMsgRef = db.ref('messages').push();
            newMsgRef.set({
                id: newMsgRef.key,
                type: 'text',
                text: text,
                username: myUsername,
                avatar: myAvatar || '',
                time: Date.now(),
                read: false,
                sender: myUsername
            });

            msgInput.value = '';
            msgInput.focus();
        }

        // ============================================================
        // استقبال الرسائل
        // ============================================================
        db.ref('messages').on('child_added', function(snapshot) {
            const data = snapshot.val();
            if (!data) return;

            emptyState.style.display = 'none';
            if (document.querySelector(`[data-msg-id="${data.id}"]`)) return;

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.setAttribute('data-msg-id', data.id);

            const isMe = data.sender === myUsername || data.username === myUsername;

            if (isMe) {
                msgDiv.classList.add('me');
            } else {
                msgDiv.classList.add('other');
                if (notificationsEnabled) {
                    playNotificationSound();
                }
            }

            // الهيدر
            const header = document.createElement('div');
            header.className = 'msg-header';

            const avatarImg = document.createElement('img');
            avatarImg.className = 'msg-avatar';
            avatarImg.src = data.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(data.username || 'مجهول') + '&background=25d366&color=fff';
            avatarImg.onerror = function() {
                this.src = 'https://ui-avatars.com/api/?name=U&background=25d366&color=fff';
            };

            const usernameSpan = document.createElement('span');
            usernameSpan.className = 'msg-username';
            usernameSpan.textContent = data.username || 'مجهول';

            header.appendChild(avatarImg);
            header.appendChild(usernameSpan);

            // المحتوى
            let content;
            if (data.type === 'voice') {
                content = document.createElement('div');
                content.className = 'voice-message';
                const icon = document.createElement('span');
                icon.className = 'voice-icon';
                icon.innerHTML = '<i class="fas fa-microphone"></i>';
                const audio = document.createElement('audio');
                audio.controls = true;
                audio.src = data.audio;
                audio.preload = 'metadata';
                content.appendChild(icon);
                content.appendChild(audio);
            } else if (data.type === 'image') {
                content = document.createElement('div');
                content.className = 'image-message';
                const img = document.createElement('img');
                img.src = data.image;
                img.alt = 'صورة';
                img.onclick = function() {
                    window.open(data.image, '_blank');
                };
                content.appendChild(img);
            } else {
                const textSpan = document.createElement('span');
                textSpan.className = 'msg-text';
                textSpan.textContent = data.text || '';
                content = textSpan;
            }

            // الفوتر
            const footer = document.createElement('div');
            footer.className = 'msg-footer';

            const timeSpan = document.createElement('span');
            timeSpan.className = 'msg-time';
            const date = new Date(data.time);
            const hours = String(date.getHours()).padStart(2, '0');
            const mins = String(date.getMinutes()).padStart(2, '0');
            timeSpan.textContent = `${hours}:${mins}`;

            const tickSpan = document.createElement('span');
            tickSpan.className = 'tick';
            if (isMe) {
                if (data.read) {
                    tickSpan.innerHTML = '✓✓';
                    tickSpan.classList.add('read');
                } else {
                    tickSpan.textContent = '✓';
                }
            }

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
            if (isMe) {
                deleteBtn.onclick = function(e) {
                    e.stopPropagation();
                    if (confirm('حذف الرسالة؟')) {
                        deleteMessage(data.id);
                    }
                };
            } else {
                deleteBtn.style.display = 'none';
            }

            footer.appendChild(timeSpan);
            footer.appendChild(tickSpan);
            footer.appendChild(deleteBtn);

            msgDiv.appendChild(header);
            msgDiv.appendChild(content);
            msgDiv.appendChild(footer);

            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            if (!isMe && !data.read) {
                db.ref('messages/' + data.id).update({ read: true });
            }
        });

        // ============================================================
        // دوال إضافية
        // ============================================================
        function deleteMessage(msgId) {
            db.ref('messages/' + msgId).remove().then(() => {
                const el = document.querySelector(`[data-msg-id="${msgId}"]`);
                if (el) el.remove();
                if (document.querySelectorAll('.message').length === 0) {
                    emptyState.style.display = 'block';
                }
            });
        }

        function clearAllChats() {
            if (!confirm('⚠️ مسح كل الرسائل؟ سيتم حفظها في التاريخ')) return;
            db.ref('messages').remove().then(() => {
                document.querySelectorAll('.message').forEach(el => el.remove());
                emptyState.style.display = 'block';
            });
        }

        function showHistory() {
            historyPanel.classList.toggle('show');
            if (historyPanel.classList.contains('show')) {
                historyContent.innerHTML = '';
                db.ref('messages').once('value', function(snapshot) {
                    const data = snapshot.val();
                    if (!data) {
                        historyContent.innerHTML = '<div class="history-item">📭 لا توجد رسائل محفوظة</div>';
                        return;
                    }
                    const messages = Object.values(data).sort((a,b) => b.time - a.time);
                    messages.slice(0, 50).forEach(msg => {
                        const div = document.createElement('div');
                        div.className = 'history-item';
                        const text = msg.text || (msg.type === 'voice' ? '🎤 رسالة صوتية' : '🖼️ صورة');
                        const date = new Date(msg.time);
                        const time = `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
                        div.innerHTML = `<span>${msg.username}: ${text}</span><span class="h-time">${time}</span>`;
                        historyContent.appendChild(div);
                    });
                });
            }
        }

        function closeHistory() {
            historyPanel.classList.remove('show');
        }

        function scrollToFirst() {
            const first = messagesContainer.querySelector('.message');
            if (first) first.scrollIntoView({ behavior: 'smooth' });
        }

        function scrollToLast() {
            const last = messagesContainer.querySelector('.message:last-child');
            if (last) last.scrollIntoView({ behavior: 'smooth' });
        }

        // ============================================================
        // Event Listeners
        // ============================================================
        msgInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && calculator.style.display !== 'none') {
                checkSecret();
            }
        });

        window.addEventListener('beforeunload', function() {
            if (isRecording) stopRecording();
            if (isCallActive) endCall();
        });

        // ============================================================
        // تحميل الـ Config
        // ============================================================
        console.log('✅ الشات السري جاهز! الكود: 115500');
    </script>

</body>
