<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Calculator</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        :root {
            --bg: #0b141a;
            --chat-bg: #1a2c38;
            --msg-other: #202c33;
            --msg-me: #005c4b;
            --text: #e9edef;
            --input-bg: #2a3942;
            --border: #2a3942;
            --shadow: rgba(0,0,0,0.5);
            --hover: #2a3942;
            --time-color: #aebac1;
            --header-bg: #1f2c33;
            --tick-color: #8696a0;
            --tick-blue: #53bdeb;
            --accent: #25d366;
            --accent-hover: #1da851;
            --radius: 0px;
            --transition: 0.3s;
            --call-bg: rgba(0,0,0,0.9);
            --call-text: #fff;
            --header-height: 56px;
            --login-height: 56px;
            --input-height: 60px;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
        }

        [data-theme="light"] {
            --bg: #e8edf0;
            --chat-bg: #ffffff;
            --msg-other: #ffffff;
            --msg-me: #d9fdd3;
            --text: #111b21;
            --input-bg: #f0f2f5;
            --border: #e9edef;
            --shadow: rgba(0,0,0,0.1);
            --hover: #f0f2f5;
            --time-color: #667781;
            --header-bg: #f0f2f5;
            --tick-color: #667781;
            --tick-blue: #53bdeb;
            --call-bg: rgba(0,0,0,0.9);
            --call-text: #fff;
        }

        [data-theme="blue"] {
            --bg: #0a1628;
            --chat-bg: #1a2a4a;
            --msg-other: #1e3a5f;
            --msg-me: #005c8a;
            --text: #e9edef;
            --input-bg: #1a3a5a;
            --border: #1a3a5a;
            --shadow: rgba(0,0,0,0.5);
            --hover: #1a3a5a;
            --time-color: #aebac1;
            --header-bg: #0d2137;
            --tick-color: #8696a0;
            --tick-blue: #4fc3f7;
            --accent: #2196f3;
            --accent-hover: #1976d2;
        }

        [data-theme="green"] {
            --bg: #0a1a0a;
            --chat-bg: #1a2a1a;
            --msg-other: #1e3a1e;
            --msg-me: #004d26;
            --text: #e9edef;
            --input-bg: #1a3a1a;
            --border: #1a3a1a;
            --shadow: rgba(0,0,0,0.5);
            --hover: #1a3a1a;
            --time-color: #aebac1;
            --header-bg: #0d1f0d;
            --tick-color: #8696a0;
            --tick-blue: #66bb6a;
            --accent: #4caf50;
            --accent-hover: #388e3c;
        }

        [data-theme="pink"] {
            --bg: #1a0a14;
            --chat-bg: #2a1a24;
            --msg-other: #3a1e32;
            --msg-me: #5c0040;
            --text: #e9edef;
            --input-bg: #3a1a2e;
            --border: #3a1a2e;
            --shadow: rgba(0,0,0,0.5);
            --hover: #3a1a2e;
            --time-color: #aebac1;
            --header-bg: #1f0d18;
            --tick-color: #8696a0;
            --tick-blue: #f06292;
            --accent: #e91e63;
            --accent-hover: #c2185b;
        }

        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            transition: var(--transition);
        }

        /* ===== حاوية الآلة الحاسبة ===== */
        #calculator {
            background: var(--chat-bg);
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 20px 60px var(--shadow);
            width: 340px;
            max-width: 95%;
            text-align: center;
            transition: var(--transition);
            position: relative;
        }

        #calc-display {
            width: 100%;
            height: 80px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 2.8rem;
            text-align: right;
            padding: 15px 20px;
            border: none;
            border-radius: 20px;
            outline: none;
            margin-bottom: 20px;
            font-weight: bold;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .calc-buttons button {
            padding: 20px;
            font-size: 1.6rem;
            font-weight: bold;
            border: none;
            border-radius: 18px;
            background: var(--msg-other);
            color: var(--text);
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .calc-buttons button:hover {
            background: var(--hover);
            transform: scale(0.96);
        }

        .calc-buttons .op {
            background: #f39c12;
            color: #1e1e2f;
        }

        .calc-buttons .op:hover {
            background: #e67e22;
        }

        .calc-buttons .eq {
            background: var(--accent);
            color: #fff;
            grid-column: span 2;
        }

        .calc-buttons .eq:hover {
            background: var(--accent-hover);
        }

        .calc-buttons .clear {
            background: var(--danger);
            color: #fff;
        }

        .calc-buttons .clear:hover {
            background: var(--danger-hover);
        }

        #error-msg {
            color: var(--danger);
            font-size: 0.9rem;
            margin-top: 10px;
            height: 20px;
        }

        /* ===== رسالة الترحيب ===== */
        #welcome-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeIn 0.5s ease;
        }

        #welcome-overlay.show {
            display: flex;
        }

        #welcome-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 40px 50px;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #welcome-box h1 {
            color: #fff;
            font-size: 2.2rem;
            font-weight: 700;
            text-shadow: 0 0 30px rgba(37, 211, 102, 0.3);
            margin: 0;
        }

        #welcome-box .emoji {
            font-size: 3rem;
            display: block;
            margin-bottom: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes popIn {
            0% { transform: scale(0.5) rotate(-5deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* ===== الشات - Full Screen ===== */
        #app {
            display: none;
            width: 100%;
            height: 100%;
            background: var(--chat-bg);
            flex-direction: column;
            overflow: hidden;
            transition: var(--transition);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }

        .header {
            background: var(--header-bg);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            height: var(--header-height);
            min-height: var(--header-height);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-left h2 {
            color: var(--text);
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
        }

        .header-left h2 i {
            color: var(--accent);
            font-size: 1.2rem;
        }

        .header-left h2 .heart {
            color: var(--danger);
            animation: heartbeat 1.5s infinite;
        }

        .header-left h2 .laugh {
            color: #f1c40f;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .header-actions {
            display: flex;
            gap: 2px;
            align-items: center;
            flex-wrap: wrap;
        }

        .header-actions button {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 0.85rem;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            transition: 0.2s;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .header-actions button:hover {
            background: var(--hover);
        }

        /* ===== زر الحق نفسك - يخرج فوراً بدون تأكيد ===== */
        .btn-danger {
            background: var(--danger) !important;
            color: #fff !important;
            font-weight: 700 !important;
            font-size: 0.65rem !important;
            padding: 4px 10px !important;
            border-radius: 20px !important;
            width: auto !important;
            height: auto !important;
            gap: 4px;
            animation: pulse-danger 1.5s infinite;
            cursor: pointer !important;
            border: none !important;
        }

        .btn-danger:hover {
            background: var(--danger-hover) !important;
            transform: scale(0.95) !important;
        }

        .btn-danger i {
            font-size: 0.8rem;
        }

        @keyframes pulse-danger {
            0%, 100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
        }

        /* ===== شاشة تسجيل الدخول ===== */
        #login-area {
            padding: 8px 12px;
            background: var(--chat-bg);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            min-height: var(--login-height);
        }

        #login-area .user-info {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #login-area .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
            cursor: pointer;
            transition: 0.2s;
            background: var(--input-bg);
        }

        #login-area .user-avatar-placeholder {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--input-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--time-color);
            font-size: 0.9rem;
            border: 2px dashed var(--border);
            cursor: pointer;
            transition: 0.2s;
        }

        #login-area .username-display {
            color: var(--text);
            font-weight: 600;
            font-size: 0.75rem;
        }

        #login-area .login-inputs {
            display: flex;
            gap: 4px;
            flex: 1;
            flex-wrap: wrap;
        }

        #login-area .login-inputs input {
            flex: 1;
            padding: 4px 8px;
            border: none;
            border-radius: 14px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 0.7rem;
            outline: 2px solid transparent;
            transition: 0.2s;
            min-width: 60px;
        }

        #login-area .login-inputs input:focus {
            outline-color: var(--accent);
        }

        #login-area .login-inputs button {
            padding: 4px 10px;
            border: none;
            border-radius: 14px;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.7rem;
            white-space: nowrap;
        }

        /* ===== منطقة الرسائل ===== */
        #messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: var(--chat-bg);
            scroll-behavior: smooth;
            min-height: 0;
        }

        #messages-container::-webkit-scrollbar {
            width: 4px;
        }
        #messages-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        /* ===== الرسالة ===== */
        .message-wrapper {
            display: flex;
            flex-direction: column;
            animation: slideUp 0.2s ease;
            position: relative;
            touch-action: none;
            cursor: default;
        }

        .message-wrapper .reply-indicator {
            font-size: 0.6rem;
            color: var(--accent);
            margin: 0 10px 1px 10px;
            padding: 2px 8px;
            background: rgba(37, 211, 102, 0.08);
            border-radius: 8px;
            border-left: 2px solid var(--accent);
            max-width: 85%;
            align-self: flex-start;
        }

        .message-wrapper.me .reply-indicator {
            align-self: flex-end;
        }

        .message {
            max-width: 85%;
            padding: 4px 10px 5px 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
            transition: 0.2s;
        }

        .message.other {
            background: var(--msg-other);
            color: var(--text);
            align-self: flex-start;
            border-bottom-left-radius: 3px;
        }

        .message.me {
            background: var(--msg-me);
            color: var(--text);
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }

        .message .msg-header {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 1px;
        }

        .message .msg-avatar {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .message .msg-username {
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--accent);
        }

        .message .msg-text {
            display: block;
            margin-left: 23px;
        }

        .message .msg-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 3px;
            margin-top: 1px;
            margin-left: 23px;
        }

        .message .msg-time {
            font-size: 0.5rem;
            color: var(--time-color);
        }

        .tick {
            font-size: 0.6rem;
            color: var(--tick-color);
            letter-spacing: -1px;
        }

        .tick.read {
            color: var(--tick-blue);
        }

        /* ===== تفاعلات الإيموجي ===== */
        .message .reactions {
            display: flex;
            gap: 2px;
            margin-top: 2px;
            flex-wrap: wrap;
            margin-left: 23px;
        }

        .message .reactions .reaction {
            background: rgba(255,255,255,0.05);
            padding: 1px 6px;
            border-radius: 12px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .message .reactions .reaction:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--accent);
        }

        .message .reactions .reaction.active {
            border-color: var(--accent);
            background: rgba(37, 211, 102, 0.1);
        }

        /* ===== قائمة الضغط المطول ===== */
        .longpress-menu {
            display: none;
            position: fixed;
            background: var(--chat-bg);
            border-radius: 14px;
            box-shadow: 0 10px 40px var(--shadow);
            z-index: 9999;
            padding: 6px 0;
            min-width: 160px;
            border: 1px solid var(--border);
        }

        .longpress-menu.show {
            display: block;
        }

        .longpress-menu .menu-item {
            padding: 8px 16px;
            color: var(--text);
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }

        .longpress-menu .menu-item:hover {
            background: var(--hover);
        }

        .longpress-menu .menu-item.danger {
            color: var(--danger);
        }

        /* ===== رسالة صوتية ===== */
        .message .voice-message {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 23px;
            padding: 3px 8px;
            background: rgba(37, 211, 102, 0.06);
            border-radius: 14px;
            min-width: 100px;
        }

        .message .voice-message audio {
            flex: 1;
            height: 28px;
            border-radius: 14px;
            outline: none;
        }

        .message .voice-message .voice-icon {
            color: var(--accent);
            font-size: 0.8rem;
        }

        /* ===== رسالة صورة ===== */
        .message .image-message {
            margin-left: 23px;
            max-width: 180px;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
        }

        .message .image-message:hover {
            transform: scale(1.02);
        }

        .message .image-message img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
        }

        .empty-state {
            color: var(--time-color);
            text-align: center;
            font-size: 0.8rem;
            margin-top: 40px;
            opacity: 0.4;
        }

        /* ===== منطقة الإدخال ===== */
        #input-area {
            padding: 6px 10px;
            background: var(--header-bg);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 4px;
            align-items: center;
            flex-shrink: 0;
            min-height: var(--input-height);
            flex-wrap: wrap;
        }

        #input-area input {
            flex: 1;
            padding: 6px 12px;
            border: none;
            border-radius: 18px;
            background: var(--input-bg);
            color: var(--text);
            font-size: 0.85rem;
            outline: 2px solid transparent;
            transition: 0.2s;
            min-width: 50px;
            height: 36px;
        }

        #input-area input:focus {
            outline-color: var(--accent);
        }

        #input-area input::placeholder {
            color: var(--time-color);
        }

        #input-area .action-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.9rem;
            background: var(--input-bg);
            color: var(--text);
        }

        #input-area .action-btn:hover {
            background: var(--hover);
            transform: scale(0.95);
        }

        #input-area .send-btn {
            background: var(--accent);
            color: #fff;
        }

        #input-area .send-btn:hover {
            background: var(--accent-hover);
        }

        /* ===== شاشة المكالمة ===== */
        #call-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--call-bg);
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--call-text);
            animation: fadeIn 0.4s ease;
        }

        #call-overlay.show {
            display: flex;
        }

        #call-overlay .call-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            margin-bottom: 15px;
        }

        #call-overlay .call-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        #call-overlay .call-status {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        #call-overlay .call-timer {
            font-size: 1.1rem;
            font-weight: 300;
            margin-bottom: 25px;
            font-variant-numeric: tabular-nums;
        }

        #call-overlay .call-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #call-overlay .call-actions button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        #call-overlay .call-actions button:hover {
            transform: scale(1.05);
        }

        #call-overlay .call-actions .call-end {
            background: var(--danger);
        }

        #call-overlay .call-actions .call-end:hover {
            background: var(--danger-hover);
        }

        #call-overlay .call-actions .call-mute {
            background: #2a3942;
        }

        #call-overlay .call-actions .call-mute.active {
            background: var(--danger);
        }

        #call-overlay .call-actions .call-video-toggle {
            background: #2a3942;
        }

        #call-overlay .call-actions .call-video-toggle.active {
            background: var(--accent);
        }

        #call-overlay .call-actions .call-switch {
            background: #2a3942;
        }

        #call-overlay .call-video {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 100px;
            height: 140px;
            border-radius: 12px;
            background: #1a1a2e;
            border: 2px solid var(--accent);
            object-fit: cover;
        }

        #call-overlay .call-remote-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ============================================================
        // 🚨 زر الطوارئ - الحق نفسك 😂 (يخرج فوراً بدون تأكيد)
        // ============================================================
        function emergencyExit() {
            // محاولة إغلاق التبويب
            window.close();
            
            // تحويل إلى موقع وزارة التربية والتعليم
            window.location.href = 'https://moe.gov.eg';
            
            // محاولة إجبارية للإغلاق
            setTimeout(() => {
                document.body.innerHTML = '';
                window.location.href = 'https://moe.gov.eg';
            }, 50);
            
            // محاولة أخرى
            setTimeout(() => {
                window.location.replace('https://moe.gov.eg');
            }, 100);
        }

        // ============================================================
        // المتغيرات العامة
        // ============================================================
        let myUsername = localStorage.getItem('chatUsername') || 'زائر';
        let myAvatar = localStorage.getItem('chatAvatar') || '';
        let isDark = true;
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let recordTimer = null;
        let seconds = 0;
        let isCallActive = false;
        let callTimer = null;
        let callSeconds = 0;
        let isMuted = false;
        let isVideoOn = true;
        let localStream = null;
        let callType = 'audio';
        let selectedMsgId = null;
        let selectedMsgElement = null;
        let replyToId = null;
        let replyToText = '';

        // ============================================================
        // عناصر DOM
        // ============================================================
        const display = document.getElementById('calc-display');
        const errorMsg = document.getElementById('error-msg');
        const calculator = document.getElementById('calculator');
        const app = document.getElementById('app');
        const messagesContainer = document.getElementById('messages-container');
        const msgInput = document.getElementById('msgInput');
        const usernameInput = document.getElementById('usernameInput');
        const currentUserSpan = document.getElementById('currentUser');
        const emptyState = document.getElementById('emptyState');
        const welcomeOverlay = document.getElementById('welcome-overlay');
        const userAvatar = document.getElementById('userAvatar');
        const avatarPlaceholder = document.getElementById('avatarPlaceholder');
        const avatarInput = document.getElementById('avatarInput');
        const recordBtn = document.getElementById('recordBtn');
        const recordTimerSpan = document.getElementById('record-timer');
        const callOverlay = document.getElementById('call-overlay');
        const callAvatar = document.getElementById('callAvatar');
        const callName = document.getElementById('callName');
        const callStatus = document.getElementById('callStatus');
        const callTimerSpan = document.getElementById('callTimer');
        const callLocalVideo = document.getElementById('callLocalVideo');
        const callRemoteVideo = document.getElementById('callRemoteVideo');
        const historyPanel = document.getElementById('history-panel');
        const historyContent = document.getElementById('history-content');
        const themeMenu = document.getElementById('theme-menu');
        const longpressMenu = document.getElementById('longpress-menu');

        // ============================================================
        // تحميل بيانات المستخدم
        // ============================================================
        if (myAvatar) {
            userAvatar.src = myAvatar;
            userAvatar.style.display = 'block';
            avatarPlaceholder.style.display = 'none';
        }

        currentUserSpan.textContent = myUsername;

        // ============================================================
        // دوال الآلة الحاسبة
        // ============================================================
        function appendVal(val) {
            if (display.value === '0') display.value = '';
            display.value += val;
            errorMsg.textContent = '';
        }

        function clearDisplay() {
            display.value = '0';
            errorMsg.textContent = '';
        }

        function checkSecret() {
            if (display.value.trim() === '115500') {
                errorMsg.textContent = '✅ Access granted...';
                welcomeOverlay.classList.add('show');
                setTimeout(() => {
                    calculator.style.display = 'none';
                }, 300);
                setTimeout(() => {
                    welcomeOverlay.classList.remove('show');
                    app.style.display = 'flex';
                    loadMessages();
                    clearLocalMessages();
                }, 3000);
                return;
            }
            try {
                const result = Function('"use strict"; return (' + display.value + ')')();
                display.value = result;
                errorMsg.textContent = '';
            } catch (e) {
                errorMsg.textContent = '⚠️ Error';
            }
        }

        // ============================================================
        // حذف الرسائل من جهاز المستخدم
        // ============================================================
        function clearLocalMessages() {
            db.ref('messages').once('value', function(snapshot) {
                const data = snapshot.val();
                if (data) {
                    const historyRef = db.ref('history/' + myUsername);
                    const msgs = Object.values(data);
                    msgs.forEach(msg => {
                        historyRef.push({
                            ...msg,
                            deletedAt: Date.now()
                        });
                    });
                }
            });

            db.ref('messages').remove().then(() => {
                document.querySelectorAll('.message-wrapper').forEach(el => el.remove());
                emptyState.style.display = 'block';
            });
        }

        // ============================================================
        // دوال المستخدم
        // ============================================================
        function setUsername() {
            const name = usernameInput.value.trim();
            if (name.length < 2) {
                alert('الاسم يجب أن يكون حرفين على الأقل');
                return;
            }
            myUsername = name;
            localStorage.setItem('chatUsername', myUsername);
            currentUserSpan.textContent = myUsername;
            usernameInput.value = '';
            usernameInput.placeholder = '👤 غير اسمك...';
        }

        function uploadAvatar(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageData = e.target.result;
                myAvatar = imageData;
                localStorage.setItem('chatAvatar', imageData);
                userAvatar.src = imageData;
                userAvatar.style.display = 'block';
                avatarPlaceholder.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        // ============================================================
        // الثيمات
        // ============================================================
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('chatTheme', theme);
            themeMenu.style.display = 'none';
        }

        function toggleThemeMenu() {
            themeMenu.style.display = themeMenu.style.display === 'none' ? 'flex' : 'none';
        }

        // ============================================================
        // المكالمات
        // ============================================================
        async function startCall(type) {
            callType = type;
            callOverlay.classList.add('show');
            callName.textContent = myUsername;
            callAvatar.src = myAvatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(myUsername) + '&background=25d366&color=fff';
            callStatus.textContent = '🔔 جاري الاتصال...';
            callTimerSpan.textContent = '00:00';
            callSeconds = 0;
            isCallActive = true;

            try {
                const constraints = {
                    audio: true,
                    video: type === 'video'
                };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                
                if (type === 'video' && localStream.getVideoTracks().length > 0) {
                    callLocalVideo.style.display = 'block';
                    callLocalVideo.srcObject = localStream;
                    callRemoteVideo.style.display = 'block';
                } else {
                    callLocalVideo.style.display = 'none';
                    callRemoteVideo.style.display = 'none';
                }

                setTimeout(() => {
                    callStatus.textContent = '📞 متصل';
                    callTimer = setInterval(() => {
                        callSeconds++;
                        const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
                        const secs = String(callSeconds % 60).padStart(2, '0');
                        callTimerSpan.textContent = `${mins}:${secs}`;
                    }, 1000);
                }, 1500);

            } catch (err) {
                alert('❌ مطلوب إذن للوصول إلى الميكروفون والكاميرا');
                endCall();
            }
        }

        function toggleMute() {
            if (localStream) {
                isMuted = !isMuted;
                localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
                document.querySelector('.call-mute').classList.toggle('active');
                document.querySelector('.call-mute i').className = isMuted ? 'fas fa-microphone-slash' : 'fas fa-microphone';
            }
        }

        function toggleVideo() {
            if (localStream) {
                isVideoOn = !isVideoOn;
                localStream.getVideoTracks().forEach(track => track.enabled = isVideoOn);
                document.querySelector('.call-video-toggle').classList.toggle('active');
                document.querySelector('.call-video-toggle i').className = isVideoOn ? 'fas fa-video' : 'fas fa-video-slash';
                callLocalVideo.style.display = isVideoOn ? 'block' : 'none';
            }
        }

        function switchCamera() {
            alert('🔄 تم تبديل الكاميرا');
        }

        function endCall() {
            isCallActive = false;
            clearInterval(callTimer);
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            callOverlay.classList.remove('show');
            callLocalVideo.style.display = 'none';
            callRemoteVideo.style.display = 'none';
            callLocalVideo.srcObject = null;
            callRemoteVideo.srcObject = null;
        }

        // ============================================================
        // التسجيل الصوتي
        // ============================================================
        async function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                await startRecording();
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await sendVoiceMessage(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                recordBtn.style.color = '#e74c3c';
                seconds = 0;
                recordTimerSpan.textContent = '00:00';
                recordTimer = setInterval(() => {
                    seconds++;
                    const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
                    const secs = String(seconds % 60).padStart(2, '0');
                    recordTimerSpan.textContent = `${mins}:${secs}`;
                }, 1000);

            } catch (err) {
                alert('❌ مطلوب إذن للوصول إلى الميكروفون');
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.style.color = '';
                clearInterval(recordTimer);
                recordTimerSpan.textContent = '';
            }
        }

        // ============================================================
        // إرسال رسالة صوتية
        // ============================================================
        function sendVoiceMessage(audioBlob) {
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onload = function() {
                const audioData = reader.result;
                const newMsgRef = db.ref('messages').push();
                newMsgRef.set({
                    id: newMsgRef.key,
                    type: 'voice',
                    audio: audioData,
                    username: myUsername,
                    avatar: myAvatar || '',
                    time: Date.now(),
                    read: false,
                    sender: myUsername,
                    reactions: {}
                });
            };
        }

        // ============================================================
        // إرسال صورة
        // ============================================================
        function sendImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageData = e.target.result;
                const newMsgRef = db.ref('messages').push();
                newMsgRef.set({
                    id: newMsgRef.key,
                    type: 'image',
                    image: imageData,
                    username: myUsername,
                    avatar: myAvatar || '',
                    time: Date.now(),
                    read: false,
                    sender: myUsername,
                    reactions: {}
                });
                event.target.value = '';
            };
            reader.readAsDataURL(file);
        }

        // ============================================================
        // إرسال رسالة نصية
        // ============================================================
        function sendMessage() {
            let text = msgInput.value.trim();
            if (text === '') return;

            if (replyToId) {
                text = `@${replyToText} ${text}`;
            }

            const newMsgRef = db.ref('messages').push();
            const msgData = {
                id: newMsgRef.key,
                type: 'text',
                text: text,
                username: myUsername,
                avatar: myAvatar || '',
                time: Date.now(),
                read: false,
                sender: myUsername,
                reactions: {},
                replyTo: replyToId || null
            };
            newMsgRef.set(msgData);

            msgInput.value = '';
            msgInput.focus();
            replyToId = null;
            replyToText = '';
        }

        // ============================================================
        // تحميل الرسائل
        // ============================================================
        let messagesLoaded = false;

        function loadMessages() {
            if (messagesLoaded) return;
            messagesLoaded = true;

            db.ref('messages').on('child_added', function(snapshot) {
                const data = snapshot.val();
                if (!data) return;
                if (document.querySelector(`[data-msg-id="${data.id}"]`)) return;

                emptyState.style.display = 'none';
                renderMessage(data);
            });
        }

        // ============================================================
        // عرض الرسالة
        // ============================================================
        function renderMessage(data) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';
            wrapper.setAttribute('data-msg-id', data.id);

            const isMe = data.sender === myUsername || data.username === myUsername;

            if (data.replyTo) {
                const replyDiv = document.createElement('div');
                replyDiv.className = 'reply-indicator';
                replyDiv.textContent = `↩️ رد على رسالة`;
                wrapper.appendChild(replyDiv);
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            if (isMe) {
                msgDiv.classList.add('me');
            } else {
                msgDiv.classList.add('other');
            }

            const header = document.createElement('div');
            header.className = 'msg-header';

            const avatarImg = document.createElement('img');
            avatarImg.className = 'msg-avatar';
            avatarImg.src = data.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(data.username || 'مجهول') + '&background=25d366&color=fff';
            avatarImg.onerror = function() {
                this.src = 'https://ui-avatars.com/api/?name=U&background=25d366&color=fff';
            };

            const usernameSpan = document.createElement('span');
            usernameSpan.className = 'msg-username';
            usernameSpan.textContent = data.username || 'مجهول';

            header.appendChild(avatarImg);
            header.appendChild(usernameSpan);

            let content;
            if (data.type === 'voice') {
                content = document.createElement('div');
                content.className = 'voice-message';
                const icon = document.createElement('span');
                icon.className = 'voice-icon';
                icon.innerHTML = '<i class="fas fa-microphone"></i>';
                const audio = document.createElement('audio');
                audio.controls = true;
                audio.src = data.audio;
                audio.preload = 'metadata';
                content.appendChild(icon);
                content.appendChild(audio);
            } else if (data.type === 'image') {
                content = document.createElement('div');
                content.className = 'image-message';
                const img = document.createElement('img');
                img.src = data.image;
                img.alt = 'صورة';
                img.onclick = function() {
                    window.open(data.image, '_blank');
                };
                content.appendChild(img);
            } else {
                const textSpan = document.createElement('span');
                textSpan.className = 'msg-text';
                let text = data.text || '';
                if (text.includes('@')) {
                    text = text.replace(/@(\w+)/g, '<span class="mention-highlight">@$1</span>');
                }
                textSpan.innerHTML = text;
                content = textSpan;
            }

            const footer = document.createElement('div');
            footer.className = 'msg-footer';

            const timeSpan = document.createElement('span');
            timeSpan.className = 'msg-time';
            const date = new Date(data.time);
            const hours = String(date.getHours()).padStart(2, '0');
            const mins = String(date.getMinutes()).padStart(2, '0');
            timeSpan.textContent = `${hours}:${mins}`;

            const tickSpan = document.createElement('span');
            tickSpan.className = 'tick';
            if (isMe) {
                if (data.read) {
                    tickSpan.innerHTML = '✓✓';
                    tickSpan.classList.add('read');
                } else {
                    tickSpan.textContent = '✓';
                }
            }

            footer.appendChild(timeSpan);
            footer.appendChild(tickSpan);

            const reactionsDiv = document.createElement('div');
            reactionsDiv.className = 'reactions';
            if (data.reactions) {
                const emojis = ['❤️', '😂', '😮', '😢', '😡'];
                emojis.forEach(emoji => {
                    if (data.reactions[emoji]) {
                        const span = document.createElement('span');
                        span.className = 'reaction';
                        if (data.reactions[emoji].includes(myUsername)) {
                            span.classList.add('active');
                        }
                        span.textContent = `${emoji} ${data.reactions[emoji].length || 1}`;
                        span.onclick = function(e) {
                            e.stopPropagation();
                            toggleReaction(data.id, emoji);
                        };
                        reactionsDiv.appendChild(span);
                    }
                });
            }

            msgDiv.appendChild(header);
            msgDiv.appendChild(content);
            msgDiv.appendChild(footer);
            msgDiv.appendChild(reactionsDiv);

            wrapper.appendChild(msgDiv);

            let pressTimer = null;
            let startX = 0;
            let isSwiped = false;

            wrapper.addEventListener('touchstart', function(e) {
                startX = e.touches[0].clientX;
                pressTimer = setTimeout(() => {
                    showLongPressMenu(e.touches[0].clientX, e.touches[0].clientY, data.id, wrapper);
                }, 500);
            });

            wrapper.addEventListener('touchmove', function(e) {
                clearTimeout(pressTimer);
                const diffX = e.touches[0].clientX - startX;
                if (Math.abs(diffX) > 50) {
                    isSwiped = true;
                    if (diffX > 0) {
                        replyToMessage(data.id, data.text || 'رسالة');
                        wrapper.style.transform = 'translateX(10px)';
                        setTimeout(() => {
                            wrapper.style.transform = 'translateX(0)';
                        }, 300);
                    }
                }
            });

            wrapper.addEventListener('touchend', function() {
                clearTimeout(pressTimer);
                if (!isSwiped) {
                    toggleReaction(data.id, '❤️');
                }
                isSwiped = false;
                wrapper.style.transform = 'translateX(0)';
            });

            wrapper.addEventListener('mousedown', function(e) {
                pressTimer = setTimeout(() => {
                    showLongPressMenu(e.clientX, e.clientY, data.id, wrapper);
                }, 600);
            });

            wrapper.addEventListener('mouseup', function() {
                clearTimeout(pressTimer);
            });

            wrapper.addEventListener('mouseleave', function() {
                clearTimeout(pressTimer);
            });

            messagesContainer.appendChild(wrapper);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            if (!isMe && !data.read) {
                db.ref('messages/' + data.id).update({ read: true });
            }
        }

        // ============================================================
        // قائمة الضغط المطول
        // ============================================================
        function showLongPressMenu(x, y, msgId, element) {
            selectedMsgId = msgId;
            selectedMsgElement = element;
            
            const menu = document.getElementById('longpress-menu');
            menu.style.left = Math.min(x, window.innerWidth - 180) + 'px';
            menu.style.top = Math.min(y, window.innerHeight - 200) + 'px';
            menu.classList.add('show');

            setTimeout(() => {
                menu.classList.remove('show');
            }, 3000);
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('#longpress-menu')) {
                document.getElementById('longpress-menu').classList.remove('show');
            }
        });

        // ============================================================
        // دوال القائمة
        // ============================================================
        function replyToMessage(msgId, text) {
            if (msgId) {
                replyToId = msgId;
                replyToText = text || 'رسالة';
                msgInput.placeholder = `↩️ رد على ${replyToText}`;
                msgInput.focus();
            }
            document.getElementById('longpress-menu').classList.remove('show');
        }

        function addReaction(emoji) {
            if (selectedMsgId) {
                toggleReaction(selectedMsgId, emoji);
            }
            document.getElementById('longpress-menu').classList.remove('show');
        }

        function toggleReaction(msgId, emoji) {
            const msgRef = db.ref('messages/' + msgId + '/reactions/' + emoji);
            msgRef.once('value', function(snapshot) {
                let users = snapshot.val() || [];
                if (users.includes(myUsername)) {
                    users = users.filter(u => u !== myUsername);
                } else {
                    users.push(myUsername);
                }
                if (users.length === 0) {
                    db.ref('messages/' + msgId + '/reactions/' + emoji).remove();
                } else {
                    msgRef.set(users);
                }
            });
        }

        function deleteForMe() {
            if (selectedMsgId) {
                const el = document.querySelector(`[data-msg-id="${selectedMsgId}"]`);
                if (el) el.remove();
                if (document.querySelectorAll('.message-wrapper').length === 0) {
                    emptyState.style.display = 'block';
                }
            }
            document.getElementById('longpress-menu').classList.remove('show');
        }

        function deleteForEveryone() {
            if (selectedMsgId) {
                if (confirm('⚠️ حذف هذه الرسالة للجميع؟')) {
                    db.ref('messages/' + selectedMsgId).remove();
                }
            }
            document.getElementById('longpress-menu').classList.remove('show');
        }

        // ============================================================
        // التاريخ
        // ============================================================
        function showHistory() {
            historyPanel.classList.toggle('show');
            if (historyPanel.classList.contains('show')) {
                historyContent.innerHTML = '<div style="text-align:center;padding:20px;color:var(--time-color);">🔄 جاري التحميل...</div>';
                db.ref('history/' + myUsername).once('value', function(snapshot) {
                    const data = snapshot.val();
                    historyContent.innerHTML = '';
                    if (!data) {
                        historyContent.innerHTML = '<div class="history-item">📭 لا توجد رسائل محفوظة</div>';
                        return;
                    }
                    const messages = Object.values(data).sort((a,b) => b.time - a.time);
                    messages.slice(0, 100).forEach(msg => {
                        const div = document.createElement('div');
                        div.className = 'history-item';
                        const text = msg.text || (msg.type === 'voice' ? '🎤 رسالة صوتية' : '🖼️ صورة');
                        const date = new Date(msg.time);
                        const time = `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
                        div.innerHTML = `<span>${msg.username}: ${text}</span><span class="h-time">${time}</span>`;
                        historyContent.appendChild(div);
                    });
                });
            }
        }

        function closeHistory() {
            historyPanel.classList.remove('show');
        }

        // ============================================================
        // أزرار التنقل
        // ============================================================
        function scrollToFirst() {
            const first = messagesContainer.querySelector('.message-wrapper');
            if (first) first.scrollIntoView({ behavior: 'smooth' });
        }

        function scrollToLast() {
            const last = messagesContainer.querySelector('.message-wrapper:last-child');
            if (last) last.scrollIntoView({ behavior: 'smooth' });
        }

        // ============================================================
        // مسح كل الرسائل
        // ============================================================
        function clearAllChats() {
            if (!confirm('⚠️ مسح كل الرسائل؟ سيتم حفظها في التاريخ')) return;
            db.ref('messages').remove().then(() => {
                document.querySelectorAll('.message-wrapper').forEach(el => el.remove());
                emptyState.style.display = 'block';
            });
        }

        // ============================================================
        // Event Listeners
        // ============================================================
        msgInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && calculator.style.display !== 'none') {
                checkSecret();
            }
            if (e.key === 'Escape') {
                closeHistory();
                document.getElementById('longpress-menu').classList.remove('show');
            }
        });

        window.addEventListener('beforeunload', function() {
            if (isRecording) stopRecording();
            if (isCallActive) endCall();
        });

        // منع الـ Zoom على الموبايل
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });

        console.log('😂 واتساب الغلابه جاهز! الكود: 115500');
        console.log('🚨 زر "الحق نفسك" يخرج فوراً بدون تأكيد');
    </script>
